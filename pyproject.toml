[project]
name = "akeylimiter"
version = "0.1.0"
description = "Key based async rate limiting"
readme = "README.md"
authors = [
    { name = "RektPunk", email = "rektpunk@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiolimiter>=1.3.0",
    "cachetools>=7.2.0",
]

[project.urls]
repository = "https://github.com/RektPunk/akeylimiter"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM"]
